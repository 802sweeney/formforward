<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f8fafc; color: #1e293b; height: 100vh; display: flex; flex-direction: column; }

  header {
    background: #fff; border-bottom: 1px solid #e2e8f0;
    padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 700; }
  header .sub { font-size: 12px; color: #64748b; }

  .app { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  aside {
    width: 320px; background: #fff; border-right: 1px solid #e2e8f0;
    display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
  }

  .section { padding: 16px; border-bottom: 1px solid #f1f5f9; }
  .section h2 { font-size: 11px; font-weight: 700; text-transform: uppercase;
                letter-spacing: .05em; color: #64748b; margin-bottom: 12px; }

  label { display: block; font-size: 12px; color: #64748b; margin-bottom: 3px; margin-top: 10px; }
  label:first-of-type { margin-top: 0; }

  input[type=number], select {
    width: 100%; padding: 7px 10px; border: 1px solid #e2e8f0; border-radius: 6px;
    font-size: 13px; color: #1e293b; background: #f8fafc;
  }
  input[type=range] { width: 100%; accent-color: #3b82f6; }
  .range-row { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; }

  .btn {
    width: 100%; padding: 10px; margin-top: 14px;
    background: #3b82f6; color: #fff; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: #2563eb; }
  .btn:disabled { background: #94a3b8; cursor: default; }

  .today-pill {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    background: #dbeafe; color: #1d4ed8; font-size: 10px; font-weight: 600;
    margin-left: 6px; cursor: pointer; vertical-align: middle;
  }

  /* ── Results list ── */
  #results { flex: 1; overflow-y: auto; }
  .seg-card {
    padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
    transition: background .1s;
  }
  .seg-card:hover { background: #f8fafc; }
  .seg-card.active { background: #eff6ff; border-left: 3px solid #3b82f6; }
  .seg-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .seg-meta { font-size: 11px; color: #64748b; display: flex; flex-wrap: wrap; gap: 8px; }
  .seg-score { float: right; font-size: 11px; font-weight: 700; }
  .seg-reco { font-size: 11px; color: #3b82f6; margin-top: 4px; }

  .score-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px;
  }
  .empty { padding: 32px 16px; text-align: center; color: #94a3b8; font-size: 13px; }
  .spinner { text-align: center; padding: 32px; font-size: 13px; color: #64748b; }

  /* ── Map ── */
  #map { flex: 1; z-index: 0; }

  /* Leaflet popup */
  .popup-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .popup-row { font-size: 12px; margin: 2px 0; color: #475569; }
  .popup-reco { font-size: 12px; font-weight: 600; color: #2563eb; margin-top: 6px; }
  .popup-link { font-size: 11px; color: #3b82f6; text-decoration: none; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🗺️ Route Planner</h1>
    <div class="sub">Find Strava segments that match your intervals</div>
  </div>
</header>

<div class="app">
  <aside>
    <!-- Workout config -->
    <div class="section">
      <h2>Workout <span id="todayBadge" class="today-pill" style="display:none" onclick="loadTodayWorkout()">Today ↓</span></h2>

      <label>Interval type</label>
      <select id="workoutType" onchange="onTypeChange()">
        <option value="vo2max">VO2max</option>
        <option value="threshold">Threshold</option>
        <option value="anaerobic">Anaerobic / Sprints</option>
        <option value="sweetspot">Sweet Spot</option>
        <option value="endurance">Endurance</option>
        <option value="custom">Custom</option>
      </select>

      <label>Target duration per interval (min)</label>
      <input type="number" id="targetMin" value="5" min="0.5" max="60" step="0.5">

      <label>Target power (watts)</label>
      <input type="number" id="targetWatts" value="285" min="50" max="700" step="5">

      <label>Number of intervals</label>
      <input type="number" id="numIntervals" value="5" min="1" max="20" step="1">

      <label>Search radius: <span id="radiusLabel">10 mi</span></label>
      <input type="range" id="radius" min="5" max="25" value="10" step="5"
             oninput="document.getElementById('radiusLabel').textContent=this.value+' mi'">
      <div class="range-row"><span>5 mi</span><span>25 mi</span></div>

      <button class="btn" id="searchBtn" onclick="search()">Find Segments</button>
    </div>

    <!-- Results -->
    <div id="results">
      <div class="empty">Configure your workout above and hit Find Segments.</div>
    </div>
  </aside>

  <div id="map"></div>
</div>

<script>
const API = 'http://localhost:5680/api';

// Preset power values per workout type (% of FTP=250)
const PRESETS = {
  vo2max:    { watts: 285, min: 5  },
  threshold: { watts: 255, min: 13 },
  anaerobic: { watts: 380, min: 0.5 },
  sweetspot: { watts: 241, min: 15 },
  endurance: { watts: 190, min: 30 },
  custom:    { watts: null, min: null },
};

function onTypeChange() {
  const t = document.getElementById('workoutType').value;
  const p = PRESETS[t];
  if (p.watts) document.getElementById('targetWatts').value = p.watts;
  if (p.min)   document.getElementById('targetMin').value   = p.min;
}

// ── Today's workout pre-fill ──────────────────────────────────────────────────
let todayWorkout = null;

async function loadTodayWorkout() {
  if (!todayWorkout) return;
  // Parse notes to guess interval duration + watts
  const notes = todayWorkout.notes || '';
  // Try to extract "Xmin" and "@YW" from notes
  const minMatch   = notes.match(/(\d+(?:\.\d+)?)\s*(?:×\d+)?min/i);
  const wattsMatch = notes.match(/@\s*(\d+)W/);
  if (minMatch)   document.getElementById('targetMin').value   = parseFloat(minMatch[1]);
  if (wattsMatch) document.getElementById('targetWatts').value = parseInt(wattsMatch[1]);
  // Guess num intervals
  const repsMatch = notes.match(/(\d+)\s*[×x]/);
  if (repsMatch) document.getElementById('numIntervals').value = parseInt(repsMatch[1]);
}

// ── Map setup ─────────────────────────────────────────────────────────────────
let map, homeMarker;
let segmentLayers = {};
let activeSegId   = null;

function initMap(lat, lng) {
  map = L.map('map').setView([lat, lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 18,
  }).addTo(map);
  homeMarker = L.circleMarker([lat, lng], {
    radius: 10, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.8, weight: 2,
  }).addTo(map).bindPopup('<b>Home base</b>');
}

function scoreColor(score) {
  if (score >= 0.8) return '#22c55e'; // green — great match
  if (score >= 0.5) return '#f59e0b'; // amber — decent
  return '#ef4444';                    // red — poor match
}

function clearSegments() {
  Object.values(segmentLayers).forEach(l => map.removeLayer(l));
  segmentLayers = {};
  activeSegId   = null;
}

function drawSegments(segments) {
  clearSegments();
  segments.forEach(seg => {
    const color = scoreColor(seg.score);
    // Use decoded polyline if available, otherwise fall back to straight line
    const latlngs = seg.polyline?.length
      ? seg.polyline
      : (seg.start_latlng?.length && seg.end_latlng?.length
          ? [seg.start_latlng, seg.end_latlng]
          : null);
    if (!latlngs) return;
    const line = L.polyline(latlngs, { color, weight: 5, opacity: 0.85 });
    line.on('click', () => selectSegment(seg.id));
    line.bindPopup(makePopup(seg), { maxWidth: 260 });
    line.addTo(map);
    segmentLayers[seg.id] = line;
  });

  // Fit map to show all segments + home
  const allLatLngs = segments
    .filter(s => s.start_latlng?.length)
    .flatMap(s => [s.start_latlng, s.end_latlng]);
  if (allLatLngs.length) {
    map.fitBounds(L.latLngBounds(allLatLngs).pad(0.15));
  }
}

function makePopup(seg) {
  const gradeStr = seg.avg_grade >= 0
    ? `+${seg.avg_grade.toFixed(1)}%`
    : `${seg.avg_grade.toFixed(1)}%`;
  const repStr = seg.laps_per_interval > 1
    ? `${seg.laps_per_interval} laps per interval · ${seg.total_laps} laps total`
    : `${seg.total_laps} interval${seg.total_laps > 1 ? 's' : ''} on this segment`;
  return `
    <div class="popup-title">${seg.name}</div>
    <div class="popup-row">📏 ${seg.distance_mi} mi &nbsp;·&nbsp; 📐 ${gradeStr}</div>
    <div class="popup-row">⏱ ~${seg.estimated_min} min at target power</div>
    <div class="popup-reco">${repStr}</div>
    <a class="popup-link" href="https://www.strava.com/segments/${seg.id}" target="_blank">View on Strava ↗</a>
  `;
}

function selectSegment(id) {
  // Highlight in sidebar
  document.querySelectorAll('.seg-card').forEach(el => el.classList.remove('active'));
  const card = document.getElementById('card-' + id);
  if (card) { card.classList.add('active'); card.scrollIntoView({ block: 'nearest' }); }

  // Highlight on map
  if (activeSegId && segmentLayers[activeSegId]) {
    const prev = segmentLayers[activeSegId];
    prev.setStyle({ weight: 5, opacity: 0.85 });
  }
  if (segmentLayers[id]) {
    segmentLayers[id].setStyle({ weight: 8, opacity: 1 });
    segmentLayers[id].openPopup();
  }
  activeSegId = id;
}

// ── Sidebar results ───────────────────────────────────────────────────────────
function renderResults(segments) {
  const el = document.getElementById('results');
  if (!segments.length) {
    el.innerHTML = '<div class="empty">No matching segments found. Try a larger radius or different interval duration.</div>';
    return;
  }
  el.innerHTML = segments.map(seg => {
    const color   = scoreColor(seg.score);
    const pct     = Math.round(seg.score * 100);
    const gradeStr = seg.avg_grade >= 0 ? `+${seg.avg_grade.toFixed(1)}%` : `${seg.avg_grade.toFixed(1)}%`;
    const repStr  = seg.laps_per_interval > 1
      ? `${seg.laps_per_interval} laps/interval · ${seg.total_laps} total laps`
      : `${seg.total_laps} interval${seg.total_laps > 1 ? 's' : ''}`;
    const hasPolyline = seg.polyline?.length ? '' : ' <span style="color:#cbd5e1;font-size:9px;">~</span>';
    return `
      <div class="seg-card" id="card-${seg.id}" onclick="selectSegment(${seg.id})">
        <div class="seg-name">
          <span class="score-dot" style="background:${color}"></span>${seg.name}${hasPolyline}
          <span class="seg-score" style="color:${color}">${pct}%</span>
        </div>
        <div class="seg-meta">
          <span>📏 ${seg.distance_mi} mi</span>
          <span>📐 ${gradeStr}</span>
          <span>⏱ ~${seg.estimated_min} min</span>
        </div>
        <div class="seg-reco">${repStr}</div>
      </div>`;
  }).join('');
}

// ── Search ────────────────────────────────────────────────────────────────────
let homeCoords = null;

async function search() {
  const btn = document.getElementById('searchBtn');
  const results = document.getElementById('results');
  btn.disabled = true;
  btn.textContent = 'Searching…';
  results.innerHTML = '<div class="spinner">Calling Strava API…</div>';

  const radiusMi = parseFloat(document.getElementById('radius').value);
  const params = new URLSearchParams({
    lat:           homeCoords.lat,
    lng:           homeCoords.lng,
    radius_km:     (radiusMi * 1.60934).toFixed(1),  // convert mi → km for API
    target_min:    document.getElementById('targetMin').value,
    target_watts:  document.getElementById('targetWatts').value,
    num_intervals: document.getElementById('numIntervals').value,
  });

  try {
    const resp = await fetch(`${API}/segments?${params}`);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'Unknown error');
    renderResults(data.segments);
    drawSegments(data.segments);
  } catch (e) {
    results.innerHTML = `<div class="empty" style="color:#ef4444">Error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Find Segments';
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
(async () => {
  // Get home location
  try {
    homeCoords = await fetch(`${API}/home`).then(r => r.json());
  } catch {
    homeCoords = { lat: 44.6054, lng: -71.8838 };
  }
  initMap(homeCoords.lat, homeCoords.lng);

  // Check for today's workout
  try {
    todayWorkout = await fetch(`${API}/today-workout`).then(r => r.json());
    if (todayWorkout && todayWorkout.name) {
      document.getElementById('todayBadge').style.display = 'inline-block';
      document.getElementById('todayBadge').title = todayWorkout.name;
    }
  } catch { /* no today workout */ }
})();
</script>
</body>
</html>
